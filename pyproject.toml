[project]
name = "amex-award-hunter"
version = "0.1.0"
description = "Private business-class award search and monitoring tool built on the Seats.aero Partner API"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.40",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pandas>=2.2",
    "plotly>=5.22",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools.packages.find]
include = ["award_hunter*"]
